name: Apex Quant Mercados 24/7

on:
  schedule:
    # Cada 15 min, a destiempo (:07, :22, :37, :52): GitHub retrasa o se salta más las ejecuciones en :00 y :30
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos ejecuciones a la vez: la segunda espera a que termine la primera (sin cancelarla)
concurrency:
  group: apex-quant-mercados
  cancel-in-progress: false

jobs:
  run-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Ejecutar Apex Quant Mercados
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_quant.py

      - name: Guardar y publicar datos.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json || true
          git add historico_picks.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Auto-sync datos reales [skip ci]"
          for intento in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Fallo al publicar (intento $intento); reintentando..."
            sleep $((intento * 5))
          done
          echo "ERROR: no se pudo publicar datos.json"
          exit 1
